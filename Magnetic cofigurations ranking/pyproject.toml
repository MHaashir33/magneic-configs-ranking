[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altermagnet-alignn-screening"
version = "0.1.0"
description = "ALIGNN workflow for magnetic ground-state ranking, DFT-saving benchmarks, and altermagnet candidate screening."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
